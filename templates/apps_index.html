<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android Apps &amp; Utilities Catalog — SudoGrep</title>
  <meta name="description" content="Browse privacy-first Android apps built by SudoGrep. Explore file converters, offline utilities, expense trackers, and logic puzzle games on Google Play.">
  
  <!-- Canonical & Styling -->
  <link rel="canonical" href="https://sudogrep.in/apps/">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="stylesheet" href="/css/components.css?v=1.1">
  <link rel="stylesheet" href="/css/apps.css?v=1.1">
  
{{PARTIAL_HEAD_COMMON}}
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sudogrep.in/apps/">
  <meta property="og:title" content="Android Apps &amp; Utilities Catalog — SudoGrep">
  <meta property="og:description" content="Browse privacy-first Android apps built by SudoGrep. Explore file converters, offline utilities, expense trackers, and logic puzzle games on Google Play.">
  <meta property="og:image" content="https://sudogrep.in/assets/logo_square.png">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:url" content="https://sudogrep.in/apps/">
  <meta name="twitter:title" content="Android Apps &amp; Utilities Catalog — SudoGrep">
  <meta name="twitter:description" content="Browse privacy-first Android apps built by SudoGrep. Explore file converters, offline utilities, expense trackers, and logic puzzle games on Google Play.">
  <meta name="twitter:image" content="https://sudogrep.in/assets/logo_square.png">
  
  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Mobile Applications Portfolio",
    "url": "https://sudogrep.in/apps/",
    "description": "Explore published Android mobile applications by SudoGrep. High quality utilities with on-device computing and zero server tracking."
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://sudogrep.in/"
      },
      {
        "@type": "ListItem",
        "position": 2,
        "name": "Apps",
        "item": "https://sudogrep.in/apps/"
      }
    ]
  }
  </script>
</head>
<body>

{{PARTIAL_HEADER}}

  <main>
    
    <!-- APPS PAGE HEADER -->
    <section class="apps-page-header">
      <div class="container">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="/">Home</a>
          <span class="breadcrumb-separator">/</span>
          <span aria-current="page">Apps</span>
        </nav>
        <span class="eyebrow">OUR PRODUCTS</span>
        <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.75rem;">Published Android Applications</h1>
        <p style="color: var(--text-secondary); font-size: 1.1rem; max-width: 600px; margin-bottom: 0;">A showcase of our live Android utility applications. 100% functional, secure, and privacy-first.</p>
      </div>
    </section>

    <!-- APPS DIRECTORY GRID -->
    <section class="apps-directory-grid">
      <div class="container">
        <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--text-primary);">Our Android Utilities Suite</h2>
        <div class="grid-3">
          <!-- DYNAMICALLY COMPILED VIA BUILD.PY -->
          {{APP_LISTINGS}}
        </div>
      </div>
    </section>

  </main>

{{PARTIAL_FOOTER}}

{{PARTIAL_FLOATING_WIDGETS}}

  <script src="/js/global.js"></script>
</body>
</html>
