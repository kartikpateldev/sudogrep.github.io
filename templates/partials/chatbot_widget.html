  <!-- Ask SudoGrep AI — Floating Button -->
  <button
    class="ask-ai-float"
    id="askAiToggleBtn"
    aria-label="Open Ask SudoGrep AI chat"
    aria-expanded="false"
    aria-controls="askAiChatWindow"
    type="button"
  >
    <span class="ask-ai-float-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12">
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" y1="19" x2="20" y2="19"/>
      </svg>
    </span>
    Ask SudoGrep AI
  </button>

  <!-- Ask SudoGrep AI — Chat Window -->
  <div
    class="chat-window"
    id="askAiChatWindow"
    role="dialog"
    aria-modal="false"
    aria-label="Ask SudoGrep AI"
    aria-hidden="true"
  >
    <div class="chat-header">
      <div class="chat-header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16">
          <polyline points="4 17 10 11 4 5"/>
          <line x1="12" y1="19" x2="20" y2="19"/>
        </svg>
      </div>
      <div class="chat-header-text">
        <div class="chat-header-title">Ask SudoGrep AI</div>
        <div class="chat-header-subtitle">How can I help?</div>
      </div>
      <div class="chat-header-actions">
        <button class="chat-ctrl-btn" id="chatClearBtn" type="button" aria-label="Clear conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Clear
        </button>
        <button class="chat-ctrl-btn" id="chatCloseBtn" type="button" aria-label="Close Ask SudoGrep AI">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages" role="log" aria-label="Conversation" aria-live="polite"></div>

    <div class="chat-input-row">
      <label for="chatInput" class="sr-only">Ask a question about SudoGrep</label>
      <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Ask about tools, apps, services…"
        autocomplete="off"
        maxlength="300"
        aria-label="Ask a question about SudoGrep"
      >
      <button class="chat-send-btn" id="chatSendBtn" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="16" height="16" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>
